server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx:alpine kennt .webmanifest nicht und liefert es als
    # application/octet-stream aus. Als eigene location gesetzt, nicht ueber
    # einen types-Block: der wuerde die geerbte MIME-Tabelle ersetzen.
    location = /brand/site.webmanifest {
        default_type application/manifest+json;
    }

    # API proxy
    location /api {
        client_max_body_size 5m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
